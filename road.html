<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>RoadMate — CarPlay Ready Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#map{height:100vh}.top{position:fixed;z-index:1000;top:12px;left:12px;right:12px}.search{display:flex;gap:7px;background:#14171cee;padding:7px;border-radius:18px;box-shadow:0 8px 30px #000b}.search input{min-width:0;flex:1;background:#252a31;color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;outline:0}.search button{background:#67e48b;border:0;border-radius:12px;padding:0 18px;font-weight:800}
.modes{display:flex;gap:7px;margin-top:9px;overflow:auto}.mode{white-space:nowrap;background:#171a1fee;color:#ddd;border:1px solid #343941;border-radius:12px;padding:9px 12px;font-weight:700}.mode.active{background:#fff;color:#111;border-color:#fff}
.side{position:fixed;z-index:1000;right:12px;top:125px;display:flex;flex-direction:column;gap:8px}.round{width:48px;height:48px;border:0;border-radius:50%;background:#fff;color:#111;font-size:20px;box-shadow:0 4px 16px #0009}
.bottom{position:fixed;z-index:1000;left:12px;right:12px;bottom:12px;background:#14171eee;border:1px solid #30343a;border-radius:20px;padding:15px;box-shadow:0 8px 30px #000b}.route{display:flex;justify-content:space-between;align-items:center}.eta{font-size:29px;font-weight:850}.sub{color:#aab0b8;font-size:13px;margin-top:3px}.badge{background:#26382d;color:#8af0a5;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:800}.friends{display:flex;gap:8px;overflow:auto;margin-top:12px}.friend{min-width:150px;background:#20242a;border-radius:14px;padding:10px;border:1px solid #353a42}.friend b{display:block}.friend .reg{color:#ccc;font-size:12px;margin-top:2px}.friend button{width:100%;margin-top:8px;border:0;border-radius:9px;padding:7px;font-weight:700}
.sheet{display:none;position:fixed;z-index:1101;left:12px;right:12px;bottom:12px;background:#191c21;border:1px solid #343941;border-radius:20px;padding:16px;box-shadow:0 10px 35px #000d}.sheet h3{margin:0 0 12px}.field{margin:9px 0}.field label{font-size:12px;color:#aaa}.field input{width:100%;margin-top:4px;background:#292e35;color:#fff;border:1px solid #484e57;border-radius:10px;padding:11px}.actions{display:flex;gap:8px}.actions button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:800}
.carplay{position:fixed;z-index:1002;display:none;inset:0;background:#080a0d}.cp-head{height:58px;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;background:#11151a}.cp-logo{font-weight:900;letter-spacing:1px}.cp-logo span{color:#67e48b}.cp-map{height:calc(100vh - 150px);position:relative;background:linear-gradient(140deg,#10151a,#18221c)}.cp-road{position:absolute;left:15%;right:15%;top:45%;height:11%;background:#51565c;border-radius:20px;transform:rotate(-12deg);box-shadow:0 0 0 3px #292d32}.cp-road:after{content:"";position:absolute;left:0;right:0;top:48%;border-top:4px dashed #eee}.turn{position:absolute;left:18px;top:18px;background:#67e48b;color:#071009;border-radius:18px;padding:13px 18px;font-size:22px;font-weight:900}.cp-bottom{position:absolute;left:0;right:0;bottom:0;height:92px;background:#11151a;display:flex;align-items:center;gap:22px;padding:12px 18px}.cp-big{font-size:32px;font-weight:900}.cp-small{color:#aab0b8}.cp-friends{margin-left:auto;color:#ddd}.cp-close{border:0;background:#292e35;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800}
@media (min-width:900px){.carplay{display:block}.top,.side,.bottom{display:none}}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="search"><input id="dest" placeholder="Where are you going?"><button onclick="route()">GO</button></div>
  <div class="modes">
    <button class="mode active" data-mode="fast" onclick="mode(this)">⚡ Fastest</button>
    <button class="mode" data-mode="drive" onclick="mode(this)">🛣️ Best driving</button>
    <button class="mode" data-mode="scenic" onclick="mode(this)">🌄 Scenic</button>
    <button class="mode" data-mode="normal" onclick="mode(this)">◉ Normal</button>
  </div>
</div>

<div class="side"><button class="round" onclick="locate()">⌖</button><button class="round" onclick="openSheet()">👥</button></div>

<div class="bottom">
  <div style="font-size:12px;font-weight:900;letter-spacing:1px;color:#67e48b;margin-bottom:7px">ROAD<span style="color:#fff">MATE</span></div>
  <div class="route"><div><div class="eta" id="eta">Ready</div><div class="sub" id="distance">Choose a destination</div></div><div class="badge" id="status">READY</div></div>
  <div class="friends" id="friends"></div>
</div>

<div class="sheet" id="sheet">
<h3>Add friend & car</h3>
<div class="field"><label>Name</label><input id="name" placeholder="Friend's name"></div>
<div class="field"><label>Car</label><input id="car" placeholder="Make & model"></div>
<div class="field"><label>Registration (optional)</label><input id="reg" placeholder="AB12 CDE"></div>
<div class="actions"><button onclick="closeSheet()">Cancel</button><button onclick="addFriend()">Add friend</button></div>
</div>

<div class="carplay">
 <div class="cp-head"><div class="cp-logo">ROAD<span>MATE</span></div><div>CarPlay navigation preview</div><button class="cp-close" onclick="document.querySelector('.carplay').style.display='none'">Exit</button></div>
 <div class="cp-map"><div class="turn">↑  Turn ahead</div><div class="cp-road"></div></div>
 <div class="cp-bottom"><div><div class="cp-big" id="cpEta">—</div><div class="cp-small" id="cpDist">Waiting for route</div></div><div class="cp-friends">👥 Friends • 🚗 Cars</div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([54.5,-2.5],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let me=null,meMarker=null,line=null,currentMode='fast',friends=JSON.parse(localStorage.getItem('rm_friends')||'[]');
let navWatch=null, navigationRunning=false, destinationPoint=null;


function mode(b){document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentMode=b.dataset.mode;if(me&&document.getElementById('dest').value)route()}
function status(t){document.getElementById('status').textContent=t}
function locate(){if(!navigator.geolocation)return status('LOCATION OFF');status('LOCATING');navigator.geolocation.getCurrentPosition(p=>{me=[p.coords.latitude,p.coords.longitude];if(meMarker)map.removeLayer(meMarker);meMarker=L.circleMarker(me,{radius:9,weight:3}).addTo(map).bindPopup('You are here');map.setView(me,15);status('LOCATION ON')},()=>status('LOCATION DENIED'),{enableHighAccuracy:true})}

function startNavigation(){
 if(!me||!destinationPoint){status('ROUTE FIRST');return}
 if(!navigator.geolocation){status('GPS NOT SUPPORTED');return}
 navigationRunning=true;
 document.getElementById('startNav').style.display='none';
 document.getElementById('stopNav').style.display='block';
 document.getElementById('navInstruction').style.display='block';
 status('NAVIGATING');
 document.getElementById('navInstruction').textContent='🧭 Navigation started — GPS tracking on';
if('speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance('Navigation started'));}
 navWatch=navigator.geolocation.watchPosition(pos=>{
   me=[pos.coords.latitude,pos.coords.longitude];
   if(meMarker)map.removeLayer(meMarker);
   meMarker=L.circleMarker(me,{radius:9,weight:3}).addTo(map);
   if(navigationRunning) map.setView(me,16);
   const distance=haversine(me[0],me[1],destinationPoint[0],destinationPoint[1]);
   if(distance<0.05){
     document.getElementById('navInstruction').textContent='🏁 You have arrived';
     status('ARRIVED');
     stopNavigation();
   } else {
     document.getElementById('navInstruction').textContent='🧭 Continue on route • '+(distance<1?(distance*1000).toFixed(0)+' m':distance.toFixed(1)+' km')+' remaining';
   }
 },()=>status('GPS SIGNAL LOST'),{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
}
function stopNavigation(){
 navigationRunning=false;
 if(navWatch!==null){navigator.geolocation.clearWatch(navWatch);navWatch=null}
 document.getElementById('startNav').style.display='block';
 document.getElementById('stopNav').style.display='none';
 if(destinationPoint)document.getElementById('navInstruction').textContent='Navigation stopped';
 status('READY');
}
function haversine(a,b,c,d){
 const R=6371,rad=Math.PI/180,da=(c-a)*rad,db=(d-b)*rad;
 const x=Math.sin(da/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(db/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
async function geocode(q){let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));let d=await r.json();return d[0]?[+d[0].lat,+d[0].lon,d[0].display_name]:null}
async function route(){
 let q=document.getElementById('dest').value.trim();if(!q)return;
 if(!me){locate();status('LOCATE FIRST');return}status('ROUTING');
 try{let d=await geocode(q);if(!d){status('NOT FOUND');return}
 let u=`https://router.project-osrm.org/route/v1/driving/${me[1]},${me[0]};${d[1]},${d[0]}?overview=full&geometries=geojson&alternatives=true`;
 let x=await(await fetch(u)).json();if(x.code!=='Ok')throw 0;let routes=x.routes||[],chosen=routes[0];
 if(currentMode==='drive'&&routes.length>1)chosen=routes[routes.length-1];
 if(currentMode==='scenic'&&routes.length>1)chosen=routes.reduce((a,b)=>b.distance>a.distance?b:a);
 if(line)map.removeLayer(line);line=L.geoJSON(chosen.geometry,{weight:7}).addTo(map);map.fitBounds(line.getBounds(),{padding:[25,180]});
 let mins=Math.round(chosen.duration/60),km=chosen.distance/1000,time=mins<60?mins+' min':Math.floor(mins/60)+'h '+mins%60+'m';
 document.getElementById('eta').textContent=time;document.getElementById('distance').textContent=km.toFixed(1)+' km • '+currentMode+' route';status('READY');
 document.getElementById('cpEta').textContent=time;document.getElementById('cpDist').textContent=km.toFixed(1)+' km • '+currentMode+' route';
 }catch(e){status('ROUTE ERROR')}
}
function openSheet(){document.getElementById('sheet').style.display='block'}function closeSheet(){document.getElementById('sheet').style.display='none'}
function addFriend(){let name=document.getElementById('name').value.trim(),car=document.getElementById('car').value.trim(),reg=document.getElementById('reg').value.trim();if(!name||!car)return;friends.push({name,car,reg});localStorage.setItem('rm_friends',JSON.stringify(friends));render();closeSheet()}
function render(){let b=document.getElementById('friends');b.innerHTML='';friends.forEach((f,i)=>{let d=document.createElement('div');d.className='friend';d.innerHTML=`<b>🚗 ${esc(f.name)}</b><span class="sub">${esc(f.car)}</span><div class="reg">${f.reg?esc(f.reg):'Registration hidden'}</div><button onclick="friendInfo(${i})">View car</button>`;b.appendChild(d)})}
function friendInfo(i){let f=friends[i];alert(`${f.name}\n${f.car}\n${f.reg||'Registration hidden'}\n\nLive location requires this friend to opt in and connect their account.`)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.getElementById('dest').addEventListener('keydown',e=>{if(e.key==='Enter')route()});render();
</script>
</body></html>
