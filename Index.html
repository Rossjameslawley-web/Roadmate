<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>RoadMate — Live Traffic 3D</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07090c;color:#fff}
#map{position:fixed;inset:0}
.hud{position:fixed;z-index:20;top:12px;left:12px;right:12px;pointer-events:none}
.search{pointer-events:auto;display:flex;gap:8px;background:rgba(13,16,20,.94);padding:8px;border-radius:20px;box-shadow:0 8px 30px #000b;backdrop-filter:blur(14px)}
.search input{flex:1;min-width:0;background:#252a31;color:#fff;border:0;border-radius:13px;padding:14px;font-size:16px;outline:0}
.search button{background:#63e58a;border:0;border-radius:13px;padding:0 19px;font-weight:900}
.modes{pointer-events:auto;display:flex;gap:8px;margin-top:9px;overflow:auto}
.mode{white-space:nowrap;background:rgba(18,21,26,.94);color:#ddd;border:1px solid #383e46;border-radius:13px;padding:10px 13px;font-weight:800}
.mode.active{background:#fff;color:#111;border-color:#fff}
.side{position:fixed;z-index:20;right:12px;top:135px;display:flex;flex-direction:column;gap:9px}
.round{width:50px;height:50px;border:0;border-radius:50%;background:#fff;color:#111;font-size:20px;box-shadow:0 5px 18px #0009}
.bottom{position:fixed;z-index:20;left:14px;right:14px;bottom:14px;background:rgba(10,13,17,.94);border:1px solid #30353d;border-radius:23px;padding:15px;box-shadow:0 10px 35px #000b;backdrop-filter:blur(15px)}
.brand{font-size:12px;font-weight:950;letter-spacing:2px;color:#67e48b;margin-bottom:5px}
.brand span{color:#fff}
.route{display:flex;justify-content:space-between;align-items:center}
.eta{font-size:31px;font-weight:900}
.sub{color:#aeb5bd;font-size:13px;margin-top:3px}
.badge{background:#183a25;color:#7ff09d;padding:8px 11px;border-radius:11px;font-size:11px;font-weight:900}
.instruction{margin-top:12px;background:#20252c;border-radius:14px;padding:12px;font-size:15px;font-weight:800}
.controls{display:flex;gap:8px;margin-top:10px}
.controls button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:900}
.start{background:#63e58a;color:#071009}.stop{background:#e85d5d;color:#fff}.dark{background:#292f37;color:#fff}
.traffic{display:flex;gap:11px;align-items:center;margin-top:9px;color:#c8ced5;font-size:11px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.clear{background:#27d17f}.busy{background:#f2c230}.heavy{background:#f07828}.severe{background:#e74747}
.token{position:fixed;z-index:100;inset:0;background:rgba(5,7,10,.9);display:none;align-items:center;justify-content:center;padding:20px}
.token-card{max-width:440px;width:100%;background:#15191f;border:1px solid #343a43;border-radius:22px;padding:20px;box-shadow:0 20px 60px #000d}
.token-card h2{margin:0 0 8px}.token-card p{color:#aeb5bd;font-size:14px;line-height:1.45}
.token-card input{width:100%;background:#272d35;border:1px solid #454c56;color:#fff;border-radius:12px;padding:13px;outline:0}
.token-card button{width:100%;margin-top:10px;background:#63e58a;color:#071009;border:0;border-radius:12px;padding:13px;font-weight:900}
#trafficStatus{margin-left:auto}
.car-marker{width:30px;height:30px;border-radius:50%;background:#1677ff;border:4px solid #fff;box-shadow:0 3px 12px #0008;position:relative}
.car-marker:after{content:"";position:absolute;left:7px;top:2px;width:8px;height:16px;background:#fff;border-radius:7px;transform:rotate(0deg)}
@media(min-width:800px){.bottom{max-width:520px}.hud{max-width:760px}.search{max-width:760px}.modes{max-width:760px}}
</style>
</head>
<body>
<div id="map"></div>

<div class="hud">
  <div class="search">
    <input id="dest" placeholder="Where are you going?">
    <button onclick="route()">GO</button>
  </div>
  <div class="modes">
    <button class="mode active" data-mode="fast" onclick="mode(this)">⚡ Fastest</button>
    <button class="mode" data-mode="drive" onclick="mode(this)">🛣️ Best driving</button>
    <button class="mode" data-mode="scenic" onclick="mode(this)">🌄 Scenic</button>
    <button class="mode" data-mode="normal" onclick="mode(this)">◉ Normal</button>
  </div>
</div>

<div class="side">
  <button class="round" onclick="locate()">⌖</button>
  <button class="round" onclick="toggleTraffic()">🚦</button>
  <button class="round" onclick="toggle3D()">3D</button>
  <button class="round" onclick="toggleVoice()">🔊</button>
</div>

<div class="bottom">
  <div class="brand">ROAD<span>MATE</span></div>
  <div class="route">
    <div><div class="eta" id="eta">Ready</div><div class="sub" id="distance">Choose a destination</div></div>
    <div class="badge" id="status">READY</div>
  </div>
  <div class="instruction" id="instruction" style="display:none">🧭 Navigation ready</div>
  <div class="traffic" id="trafficLegend">
    <span><i class="dot clear"></i>Clear</span>
    <span><i class="dot busy"></i>Busy</span>
    <span><i class="dot heavy"></i>Heavy</span>
    <span><i class="dot severe"></i>Severe</span>
    <span id="trafficStatus">LIVE TRAFFIC</span>
  </div>
  <div class="controls">
    <button class="start" id="startNav" onclick="startNavigation()">▶ Start navigation</button>
    <button class="stop" id="stopNav" onclick="stopNavigation()" style="display:none">■ Stop</button>
  </div>
</div>

<div class="token" id="tokenPanel">
  <div class="token-card">
    <h2>RoadMate Mapbox key</h2>
    <p>This version uses Mapbox for genuine 3D maps, live traffic and traffic-aware routing. Paste your public Mapbox access token below. It is saved only in this browser.</p>
    <input id="tokenInput" placeholder="pk.eyJ1Ijo...">
    <button onclick="saveToken()">Load RoadMate</button>
  </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
<script>
const SAVED_TOKEN=localStorage.getItem('roadmate_mapbox_token')||'';
let map,me=null,meMarker=null,destinationPoint=null,routeLayerId=null,routeSourceId=null;
let currentMode='fast',navigationRunning=false,navWatch=null,voiceEnabled=true,trafficVisible=true,view3D=true;
let lastSpoken='',lastSpokenAt=0,lastInstructionIndex=-1,routeSteps=[];

function token(){
  return localStorage.getItem('roadmate_mapbox_token')||'';
}
function init(){
  if(!token()){document.getElementById('tokenPanel').style.display='flex';return}
  mapboxgl.accessToken=token();
  map=new mapboxgl.Map({
    container:'map',
    style:'mapbox://styles/mapbox/standard',
    center:[-2.5,54.5],
    zoom:6,
    pitch:48,
    bearing:0,
    antialias:true,
    attributionControl:true
  });
  map.addControl(new mapboxgl.NavigationControl({showCompass:false}),'top-right');
  map.on('style.load',()=>{
    addTerrain();
    addTraffic();
  });
}
function saveToken(){
  const t=document.getElementById('tokenInput').value.trim();
  if(!t.startsWith('pk.')){alert('That does not look like a Mapbox public token.');return}
  localStorage.setItem('roadmate_mapbox_token',t);
  location.reload();
}
function addTerrain(){
  if(!map.getSource('roadmate-terrain')){
    map.addSource('roadmate-terrain',{type:'raster-dem',url:'mapbox://mapbox.mapbox-terrain-dem-v1',tileSize:512,maxzoom:14});
  }
  map.setTerrain({source:'roadmate-terrain',exaggeration:1.05});
}
function addTraffic(){
  if(map.getSource('roadmate-traffic'))return;
  map.addSource('roadmate-traffic',{type:'vector',url:'mapbox://mapbox.mapbox-traffic-v1'});
  map.addLayer({
    id:'roadmate-traffic',
    type:'line',
    source:'roadmate-traffic',
    'source-layer':'traffic',
    minzoom:9,
    layout:{'line-cap':'round','line-join':'round'},
    paint:{
      'line-color':['match',['get','congestion'],
        'low','#27d17f',
        'moderate','#f2c230',
        'heavy','#f07828',
        'severe','#e74747',
        '#27d17f'],
      'line-width':['interpolate',['linear'],['zoom'],9,1.2,14,3,18,6],
      'line-opacity':0.82
    }
  });
}
function toggleTraffic(){
  trafficVisible=!trafficVisible;
  if(map&&map.getLayer('roadmate-traffic'))map.setLayoutProperty('roadmate-traffic','visibility',trafficVisible?'visible':'none');
  document.getElementById('trafficStatus').textContent=trafficVisible?'LIVE TRAFFIC':'TRAFFIC OFF';
}
function toggle3D(){
  view3D=!view3D;
  if(!map)return;
  map.setTerrain(view3D?{source:'roadmate-terrain',exaggeration:1.05}:null);
  map.easeTo({pitch:view3D?52:0,duration:500});
}
function mode(b){
  document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  currentMode=b.dataset.mode;
  if(me&&document.getElementById('dest').value)route();
}
function status(t){document.getElementById('status').textContent=t}
function locate(){
  if(!navigator.geolocation){status('GPS OFF');return}
  status('LOCATING');
  navigator.geolocation.getCurrentPosition(p=>{
    me=[p.coords.longitude,p.coords.latitude];
    setCar(me,p.coords.heading);
    if(!navigationRunning)map.easeTo({center:me,zoom:15.5,pitch:view3D?50:0,duration:700});
    status('LOCATION ON');
  },()=>status('LOCATION DENIED'),{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
}
function setCar(ll,heading){
  if(!map)return;
  if(meMarker)meMarker.remove();
  const el=document.createElement('div');el.className='car-marker';
  el.style.transform='rotate('+(Number.isFinite(heading)?heading:0)+'deg)';
  meMarker=new mapboxgl.Marker({element:el,rotationAlignment:'map'}).setLngLat(ll).addTo(map);
}
async function geocode(q){
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));
  const d=await r.json();
  return d[0]?[+d[1]||+d[0].lon,+d[0].lat,d[0].display_name]:null;
}
async function route(){
  const q=document.getElementById('dest').value.trim();
  if(!q)return;
  if(!me){locate();status('LOCATE FIRST');return}
  status('ROUTING');
  try{
    const d=await geocode(q);
    if(!d){status('NOT FOUND');return}
    destinationPoint=[d[0],d[1]];

    const profile=(currentMode==='normal')?'mapbox/driving':
                  (currentMode==='scenic')?'mapbox/driving':
                  'mapbox/driving-traffic';
    const url='https://api.mapbox.com/directions/v5/'+profile+'/'+me[0]+','+me[1]+';'+d[0]+','+d[1]+
      '?alternatives=true&geometries=geojson&overview=full&steps=true&voice_instructions=true&language=en-GB&access_token='+encodeURIComponent(token());
    const x=await (await fetch(url)).json();
    if(x.code!=='Ok')throw new Error(x.message||'Route error');

    let routes=x.routes||[];
    let chosen=routes[0];
    if(currentMode==='scenic'&&routes.length>1)chosen=routes.reduce((a,b)=>b.distance>a.distance?b:a);
    if(currentMode==='drive'&&routes.length>1)chosen=routes[1];

    drawRoute(chosen.geometry);
    routeSteps=(chosen.legs||[]).flatMap(l=>l.steps||[]);

    const mins=Math.round(chosen.duration/60),km=chosen.distance/1000;
    const time=mins<60?mins+' min':Math.floor(mins/60)+'h '+mins%60+'m';
    document.getElementById('eta').textContent=time;
    document.getElementById('distance').textContent=km.toFixed(1)+' km • '+currentMode+' route'+
      (profile.includes('traffic')?' • traffic aware':'');
    status('READY');
    document.getElementById('instruction').style.display='block';
    document.getElementById('instruction').textContent='🧭 Route ready — press Start navigation';

    const bounds=new mapboxgl.LngLatBounds();
    chosen.geometry.coordinates.forEach(c=>bounds.extend(c));
    map.fitBounds(bounds,{padding:{top:180,bottom:300,left:35,right:35},duration:700});
  }catch(e){
    console.error(e);status('ROUTE ERROR');
  }
}
function drawRoute(geometry){
  if(map.getLayer('roadmate-route'))map.removeLayer('roadmate-route');
  if(map.getLayer('roadmate-route-outline'))map.removeLayer('roadmate-route-outline');
  if(map.getSource('roadmate-route'))map.removeSource('roadmate-route');
  map.addSource('roadmate-route',{type:'geojson',data:{type:'Feature',geometry}});
  map.addLayer({id:'roadmate-route-outline',type:'line',source:'roadmate-route',
    layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#063a9e','line-width':11,'line-opacity':.8}});
  map.addLayer({id:'roadmate-route',type:'line',source:'roadmate-route',
    layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#1677ff','line-width':6}});
}
function speak(text,force=false){
  if(!voiceEnabled||!('speechSynthesis'in window)||!text)return;
  const now=Date.now();
  if(!force&&(text===lastSpoken||now-lastSpokenAt<4500))return;
  lastSpoken=text;lastSpokenAt=now;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.9;u.pitch=1;u.volume=1;
  const v=speechSynthesis.getVoices().find(x=>/^en-GB/i.test(x.lang));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function toggleVoice(){
  voiceEnabled=!voiceEnabled;
  if(!voiceEnabled&&'speechSynthesis'in window)speechSynthesis.cancel();
  const b=document.querySelectorAll('.round')[3];b.textContent=voiceEnabled?'🔊':'🔇';
}
function startNavigation(){
  if(!me||!destinationPoint){status('ROUTE FIRST');return}
  navigationRunning=true;lastSpoken='';lastSpokenAt=0;lastInstructionIndex=-1;
  document.getElementById('startNav').style.display='none';
  document.getElementById('stopNav').style.display='block';
  document.getElementById('instruction').style.display='block';
  status('NAVIGATING');
  map.easeTo({center:me,zoom:17.2,pitch:view3D?58:0,duration:800});
  speak('Navigation started',true);
  if(navWatch!==null)navigator.geolocation.clearWatch(navWatch);
  navWatch=navigator.geolocation.watchPosition(pos=>{
    me=[pos.coords.longitude,pos.coords.latitude];
    setCar(me,pos.coords.heading);
    if(navigationRunning){
      map.easeTo({
        center:me,
        zoom:17.2,
        pitch:view3D?58:0,
        bearing:Number.isFinite(pos.coords.heading)&&pos.coords.heading>=0?pos.coords.heading:map.getBearing(),
        duration:500
      });
    }
    updateInstruction();
  },()=>status('GPS SIGNAL LOST'),{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
}
function updateInstruction(){
  if(!destinationPoint)return;
  const distance=haversine(me[1],me[0],destinationPoint[1],destinationPoint[0]);
  if(distance<.05){
    document.getElementById('instruction').textContent='🏁 You have arrived';
    status('ARRIVED');speak('You have arrived at your destination',true);stopNavigation();return;
  }
  // Use Mapbox step data when available.
  let nearest=-1,best=Infinity;
  routeSteps.forEach((s,i)=>{
    if(!s.maneuver||!s.maneuver.location)return;
    const dd=haversine(me[1],me[0],s.maneuver.location[1],s.maneuver.location[0]);
    if(dd<best){best=dd;nearest=i}
  });
  if(nearest>=0&&nearest!==lastInstructionIndex&&best<.15){
    const s=routeSteps[nearest];
    const type=s.maneuver.type||'continue',mod=s.maneuver.modifier||'';
    let text='Continue';
    if(type==='turn')text='Turn '+mod;
    else if(type==='new name')text='Continue onto '+(s.name||'the road');
    else if(type==='merge')text='Merge '+mod;
    else if(type==='roundabout')text='Enter the roundabout';
    else if(type==='arrive')text='You have arrived';
    if(s.name&&type!=='arrive'&&type!=='new name')text+=' onto '+s.name;
    document.getElementById('instruction').textContent='🧭 '+text;
    speak(text);
    lastInstructionIndex=nearest;
  }else{
    const remaining=distance<1?(distance*1000).toFixed(0)+' m':distance.toFixed(1)+' km';
    document.getElementById('instruction').textContent='🧭 Continue on route • '+remaining+' remaining';
  }
}
function stopNavigation(){
  navigationRunning=false;
  if(navWatch!==null){navigator.geolocation.clearWatch(navWatch);navWatch=null}
  if('speechSynthesis'in window)speechSynthesis.cancel();
  document.getElementById('startNav').style.display='block';
  document.getElementById('stopNav').style.display='none';
  status('READY');
}
function haversine(a,b,c,d){
  const R=6371,rad=Math.PI/180,da=(c-a)*rad,db=(d-b)*rad;
  const x=Math.sin(da/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(db/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
document.getElementById('dest').addEventListener('keydown',e=>{if(e.key==='Enter')route()});
init();
</script>
</body>
</html>
