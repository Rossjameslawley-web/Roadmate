<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>RoadMate — Live Traffic 3D</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07090c;color:#fff}
#map{position:fixed;inset:0}
.hud{position:fixed;z-index:20;top:12px;left:12px;right:12px;pointer-events:none}
.search{pointer-events:auto;display:flex;gap:8px;background:rgba(13,16,20,.94);padding:8px;border-radius:20px;box-shadow:0 8px 30px #000b;backdrop-filter:blur(14px)}
.search input{flex:1;min-width:0;background:#252a31;color:#fff;border:0;border-radius:13px;padding:14px;font-size:16px;outline:0}
.search button{background:#63e58a;border:0;border-radius:13px;padding:0 19px;font-weight:900}
.modes{pointer-events:auto;display:flex;gap:8px;margin-top:9px;overflow:auto}
.mode{white-space:nowrap;background:rgba(18,21,26,.94);color:#ddd;border:1px solid #383e46;border-radius:13px;padding:10px 13px;font-weight:800}
.mode.active{background:#fff;color:#111;border-color:#fff}
.side{position:fixed;z-index:20;right:12px;top:135px;display:flex;flex-direction:column;gap:9px}
.round{width:50px;height:50px;border:0;border-radius:50%;background:#fff;color:#111;font-size:20px;box-shadow:0 5px 18px #0009}
.bottom{position:fixed;z-index:20;left:14px;right:14px;bottom:14px;background:rgba(10,13,17,.94);border:1px solid #30353d;border-radius:23px;padding:15px;box-shadow:0 10px 35px #000b;backdrop-filter:blur(15px)}
.brand{font-size:12px;font-weight:950;letter-spacing:2px;color:#67e48b;margin-bottom:5px}
.brand span{color:#fff}
.route{display:flex;justify-content:space-between;align-items:center}
.eta{font-size:31px;font-weight:900}
.sub{color:#aeb5bd;font-size:13px;margin-top:3px}
.badge{background:#183a25;color:#7ff09d;padding:8px 11px;border-radius:11px;font-size:11px;font-weight:900}
.instruction{margin-top:12px;background:#20252c;border-radius:14px;padding:12px;font-size:15px;font-weight:800}
.controls{display:flex;gap:8px;margin-top:10px}
.controls button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:900}
.start{background:#63e58a;color:#071009}.stop{background:#e85d5d;color:#fff}.dark{background:#292f37;color:#fff}
.traffic{display:flex;gap:11px;align-items:center;margin-top:9px;color:#c8ced5;font-size:11px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.clear{background:#27d17f}.busy{background:#f2c230}.heavy{background:#f07828}.severe{background:#e74747}
.token{position:fixed;z-index:100;inset:0;background:rgba(5,7,10,.9);display:none;align-items:center;justify-content:center;padding:20px}
.token-card{max-width:440px;width:100%;background:#15191f;border:1px solid #343a43;border-radius:22px;padding:20px;box-shadow:0 20px 60px #000d}
.token-card h2{margin:0 0 8px}.token-card p{color:#aeb5bd;font-size:14px;line-height:1.45}
.token-card input{width:100%;background:#272d35;border:1px solid #454c56;color:#fff;border-radius:12px;padding:13px;outline:0}
.token-card button{width:100%;margin-top:10px;background:#63e58a;color:#071009;border:0;border-radius:12px;padding:13px;font-weight:900}
#trafficStatus{margin-left:auto}
.car-marker{width:30px;height:30px;border-radius:50%;background:#1677ff;border:4px solid #fff;box-shadow:0 3px 12px #0008;position:relative}
.car-marker:after{content:"";position:absolute;left:7px;top:2px;width:8px;height:16px;background:#fff;border-radius:7px;transform:rotate(0deg)}
@media(min-width:800px){.bottom{max-width:520px}.hud{max-width:760px}.search{max-width:760px}.modes{max-width:760px}}

.explore{pointer-events:auto;margin-top:9px;background:rgba(13,16,20,.94);border:1px solid #30353d;border-radius:18px;padding:11px;box-shadow:0 8px 30px #0009;backdrop-filter:blur(14px)}
.explore-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.explore-title{font-weight:900;font-size:14px}
.random-btn{border:0;border-radius:10px;background:#63e58a;color:#071009;padding:8px 10px;font-weight:900}
.idea-row{display:flex;gap:7px;overflow:auto;padding-bottom:2px}
.idea-chip{border:1px solid #383e46;background:#20252c;color:#fff;border-radius:12px;padding:8px 10px;white-space:nowrap;font-weight:800;font-size:12px}
.idea-list{display:flex;gap:8px;overflow:auto;margin-top:9px}
.idea-card{min-width:145px;background:#20252c;border:1px solid #343a43;border-radius:14px;padding:10px}
.idea-icon{font-size:25px}
.idea-name{font-weight:900;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idea-meta{font-size:11px;color:#aeb5bd;margin-top:3px}
.idea-go{margin-top:7px;width:100%;border:0;border-radius:9px;padding:8px;background:#63e58a;color:#071009;font-weight:900}
.explore-empty{color:#aeb5bd;font-size:12px;padding:6px 2px}
@media(max-height:760px){.explore{display:none}}


.near-me{pointer-events:auto;margin-top:9px;display:flex;gap:8px}
.near-me button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:900}
.random-near{background:#63e58a;color:#071009}
.refresh-ideas{background:#292f37;color:#fff;border:1px solid #3a414a!important}


/* Clean navigation UI */
.nav-top{position:fixed;z-index:40;top:12px;left:12px;right:12px;pointer-events:none}
.nav-card{display:none;pointer-events:auto;background:#fff;color:#202124;border-radius:18px;box-shadow:0 5px 22px #0003;overflow:hidden;max-width:560px}
.nav-main{display:flex;align-items:center;padding:13px 15px;gap:13px}
.maneuver-icon{width:52px;height:52px;min-width:52px;border-radius:14px;background:#1677ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:900}
.nav-distance{font-size:27px;font-weight:900;line-height:1}
.nav-instruction{font-size:15px;font-weight:700;margin-top:4px;color:#3c4043}
.nav-road{font-size:12px;color:#70757a;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sign{background:#111;color:#fff;padding:8px 14px;font-weight:900;font-size:14px;display:none}
.nav-sign span{background:#fff;color:#111;padding:3px 8px;border-radius:4px;margin-left:5px}
.next-turn{padding:9px 15px;border-top:1px solid #e5e7eb;color:#5f6368;font-size:12px}
.clean-bottom{background:rgba(255,255,255,.97)!important;color:#202124!important;border:0!important;box-shadow:0 -2px 15px #0002!important}
.clean-bottom .brand{color:#1677ff!important}
.clean-bottom .brand span{color:#202124!important}
.clean-bottom .sub,.clean-bottom .traffic{color:#5f6368!important}
.clean-bottom .instruction{background:#f1f3f4!important;color:#202124}
.clean-bottom .dark{background:#f1f3f4!important;color:#202124}
.clean-bottom .badge{background:#e8f0fe!important;color:#1967d2!important}
.map-label{font-size:12px;font-weight:800;color:#fff;background:#1677ff;padding:4px 8px;border-radius:8px;box-shadow:0 2px 8px #0004}
@media(max-width:520px){
  .nav-card{max-width:none}
  .nav-distance{font-size:24px}
  .maneuver-icon{width:48px;height:48px;min-width:48px}
}


.quick-dest{pointer-events:auto;display:flex;gap:7px;margin-top:8px;overflow:auto}
.quick-dest button{border:0;border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.96);color:#202124;font-weight:900;white-space:nowrap;box-shadow:0 3px 12px #0002}
.quick-dest .fav-btn{background:#20252c;color:#fff}
.favourites{pointer-events:auto;margin-top:8px;background:rgba(255,255,255,.97);color:#202124;border-radius:16px;padding:10px;box-shadow:0 4px 18px #0002;display:none}
.fav-head{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px;margin-bottom:7px}
.fav-list{display:flex;gap:7px;overflow:auto}
.fav-item{background:#f1f3f4;border-radius:11px;padding:8px 10px;white-space:nowrap;font-size:12px;font-weight:800}
.fav-item button{border:0;background:transparent;font-size:12px;font-weight:900;margin-left:5px}


/* Automatic phone day/night mode */
:root{--bg:#fff;--panel:rgba(255,255,255,.97);--text:#202124;--muted:#5f6368;--field:#f1f3f4;--border:#dfe1e5;--shadow:#0002}
@media (prefers-color-scheme:dark){
  :root{--bg:#101114;--panel:rgba(25,28,32,.97);--text:#f1f3f4;--muted:#aeb5bd;--field:#292f37;--border:#3b4149;--shadow:#0008}
}
body{background:var(--bg)}
.clean-bottom{background:var(--panel)!important;color:var(--text)!important;box-shadow:0 -2px 15px var(--shadow)!important}
.clean-bottom .brand span{color:var(--text)!important}
.clean-bottom .sub,.clean-bottom .traffic{color:var(--muted)!important}
.clean-bottom .instruction{background:var(--field)!important;color:var(--text)}
.quick-dest button{background:var(--panel);color:var(--text);border-color:var(--border)}
.favourites{background:var(--panel);color:var(--text)}
.fav-item{background:var(--field);color:var(--text)}

</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
<div id="map"></div>

<div class="nav-top">
  <div class="nav-card" id="navCard">
    <div class="nav-main">
      <div class="maneuver-icon" id="maneuverIcon">↑</div>
      <div style="min-width:0;flex:1">
        <div class="nav-distance" id="navDistance">—</div>
        <div class="nav-instruction" id="navInstruction">Continue</div>
        <div class="nav-road" id="navRoad"></div>
      </div>
    </div>
    <div class="nav-sign" id="roadSign">ROAD SIGN <span id="roadSignText"></span></div>
    <div class="next-turn" id="nextTurn">Follow the route</div>
  </div>
</div>


<div class="hud">
  <div class="search">
    <input id="dest" placeholder="Where are you going?">
    <button onclick="route()">GO</button>
  </div>
  <div class="modes">
    <button class="mode active" data-mode="fast" onclick="mode(this)">⚡ Fastest</button>
    <button class="mode" data-mode="drive" onclick="mode(this)">🛣️ Best driving</button>
    <button class="mode" data-mode="scenic" onclick="mode(this)">🌄 Scenic</button>
    <button class="mode" data-mode="normal" onclick="mode(this)">◉ Normal</button>
  </div>


  <div class="quick-dest">
    <button onclick="setQuickDestination('home')">🏠 Home</button>
    <button onclick="setQuickDestination('work')">💼 Work</button>
    <button class="fav-btn" onclick="saveCurrentFavourite()">⭐ Save route</button>
    <button class="fav-btn" onclick="toggleFavourites()">❤️ Favourites</button>
  </div>
  <div class="favourites" id="favouritesPanel">
    <div class="fav-head"><span>⭐ Favourite routes</span><button onclick="hideFavourites()">✕</button></div>
    <div class="fav-list" id="favList"></div>
  </div>
  <div class="near-me">
    <button class="random-near" onclick="randomDriveNearMe()">🎲 Random drive near me</button>
    <button class="refresh-ideas" onclick="randomScenicPub()">🍺 Scenic pub</button>
  </div>
  <div class="explore">
    <div class="explore-head">
      <div class="explore-title">📍 Things to do nearby</div>
      <button class="random-btn" onclick="randomDrive()">🎲 Random drive</button>
    </div>
    <div class="idea-row">
      <button class="idea-chip" onclick="findIdeas('viewpoint')">🌄 Viewpoints</button>
      <button class="idea-chip" onclick="findIdeas('waterfall')">💦 Waterfalls</button>
      <button class="idea-chip" onclick="findIdeas('castle')">🏰 Castles</button>
      <button class="idea-chip" onclick="findIdeas('park')">🌲 Parks</button>
      <button class="idea-chip" onclick="findIdeas('cafe')">☕ Cafés</button>
      <button class="idea-chip" onclick="findIdeas('attraction')">🎡 Attractions</button>
      <button class="idea-chip" onclick="findIdeas('pub')">🍺 Pubs</button>
    </div>
    <div class="idea-list" id="ideaList">
      <div class="explore-empty">Enter an area and press GO to discover places around it.</div>
    </div>
  </div>
</div>

<div class="side">
  <button class="round" onclick="locate()">⌖</button>
  <button class="round" onclick="toggleTraffic()">🚦</button>
  <button class="round" onclick="toggle3D()">3D</button>
  <button class="round" onclick="toggleVoice()">🔊</button>
</div>

<div class="bottom clean-bottom">
  <div class="brand">ROAD<span>MATE</span></div>
  <div class="route">
    <div><div class="eta" id="eta">Ready</div><div class="sub" id="distance">Choose a destination</div></div>
    <div class="badge" id="status">READY</div>
  </div>
  <div class="instruction" id="instruction" style="display:none">🧭 Navigation ready</div>
  <div class="traffic" id="trafficLegend">
    <span><i class="dot clear"></i>Clear</span>
    <span><i class="dot busy"></i>Busy</span>
    <span><i class="dot heavy"></i>Heavy</span>
    <span><i class="dot severe"></i>Severe</span>
    <span id="trafficStatus">TRAFFIC DATA</span>
  </div>
  <div class="controls">
    <button class="start" id="startNav" onclick="startNavigation()">▶ Start navigation</button>
    <button class="stop" id="stopNav" onclick="stopNavigation()" style="display:none">■ Stop</button>
  </div>
</div>

<script>
let map, me=null, meMarker=null, destinationPoint=null;
let currentMode='fast', navigationRunning=false, navWatch=null;
let voiceEnabled=true, trafficVisible=true, view3D=true;
let lastSpoken='', lastSpokenAt=0, lastInstructionIndex=-1, routeSteps=[];
let routeLine=null, routeAltLine=null;
let currentRoute=null, navStepIndex=-1, roadSignTimer=null;
let homePlace=JSON.parse(localStorage.getItem('roadmate_home')||'null');
let workPlace=JSON.parse(localStorage.getItem('roadmate_work')||'null');
let favouriteRoutes=JSON.parse(localStorage.getItem('roadmate_favourites')||'[]');
let exploreCentre=null, explorePlaces=[], lastIdeaCategory='attraction';


function phoneIsDark(){
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function mapTileUrl(){
  return phoneIsDark()
    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
    : 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
}
function updatePhoneTheme(){
  if(!map)return;
  if(window._roadmateTiles)map.removeLayer(window._roadmateTiles);
  window._roadmateTiles=L.tileLayer(mapTileUrl(),{
    maxZoom:19,
    attribution: phoneIsDark()
      ? '&copy; OpenStreetMap contributors &copy; CARTO'
      : '&copy; OpenStreetMap contributors'
  }).addTo(map);
}
function watchPhoneTheme(){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener)mq.addEventListener('change',updatePhoneTheme);
  else if(mq.addListener)mq.addListener(updatePhoneTheme);
}

function init(){
  map=L.map('map',{zoomControl:false}).setView([-2.5,54.5],6);
  updatePhoneTheme();
  watchPhoneTheme();
  L.control.zoom({position:'topright'}).addTo(map);
  locate();
}

function status(t){document.getElementById('status').textContent=t}

function locate(){
  if(!navigator.geolocation){status('GPS OFF');return}
  status('LOCATING');
  navigator.geolocation.getCurrentPosition(p=>{
    me=[p.coords.longitude,p.coords.latitude];
    setCar(me,p.coords.heading);
    if(!navigationRunning) map.setView([me[1],me[0]],15);
    status('LOCATION ON');
  },()=>status('LOCATION DENIED'),{
    enableHighAccuracy:true,maximumAge:1000,timeout:10000
  });
}

function setCar(ll,heading){
  if(!map)return;
  if(meMarker)map.removeLayer(meMarker);
  const icon=L.divIcon({
    className:'',
    html:'<div class="car-marker"></div>',
    iconSize:[30,30],iconAnchor:[15,15]
  });
  meMarker=L.marker([ll[1],ll[0]],{icon:icon}).addTo(map);
}

function toggleTraffic(){
  trafficVisible=!trafficVisible;
  document.getElementById('trafficStatus').textContent =
    trafficVisible ? 'TRAFFIC DATA NOT AVAILABLE' : 'TRAFFIC OFF';
}

function toggle3D(){
  view3D=!view3D;
  // No-key maps do not have a genuine terrain/3D vector source.
  // Keep the control functional by adjusting zoom/visual framing.
  if(me){
    map.setZoom(view3D?17:15);
  }
}

function mode(b){
  document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  currentMode=b.dataset.mode;
  if(me && document.getElementById('dest').value) route();
}


function saveQuickPlace(type,place){
  localStorage.setItem(type==='home'?'roadmate_home':'roadmate_work',JSON.stringify(place));
  if(type==='home')homePlace=place; else workPlace=place;
  updateQuickLabels();
}

function updateQuickLabels(){
  const buttons=document.querySelectorAll('.quick-dest button');
  if(buttons[0])buttons[0].textContent=homePlace?'🏠 Home':'🏠 Set Home';
  if(buttons[1])buttons[1].textContent=workPlace?'💼 Work':'💼 Set Work';
}

async function setQuickDestination(type){
  const saved=type==='home'?homePlace:workPlace;
  if(saved){
    document.getElementById('dest').value=saved.name;
    if(!me){locate();status('LOCATE FIRST');return}
    driveToPoint([saved.lon,saved.lat],saved.name);
    return;
  }

  const q=prompt('Enter your '+type+' address or postcode:');
  if(!q)return;
  status('FINDING '+type.toUpperCase());
  try{
    const d=await geocode(q);
    if(!d){status('NOT FOUND');return}
    saveQuickPlace(type,{name:d[2]||q,lon:d[0],lat:d[1]});
    document.getElementById('dest').value=d[2]||q;
    if(!me){locate();status('LOCATE FIRST');return}
    driveToPoint([d[0],d[1]],d[2]||q);
  }catch(e){console.error(e);status('ERROR')}
}

function saveCurrentFavourite(){
  if(!destinationPoint){
    alert('Choose a destination first, then press Save route.');
    return;
  }
  const name=document.getElementById('dest').value.trim()||'Favourite route';
  const route={
    id:Date.now(),
    name:name,
    lon:destinationPoint[0],
    lat:destinationPoint[1]
  };
  favouriteRoutes.unshift(route);
  favouriteRoutes=favouriteRoutes.slice(0,12);
  localStorage.setItem('roadmate_favourites',JSON.stringify(favouriteRoutes));
  renderFavourites();
  document.getElementById('favouritesPanel').style.display='block';
  status('ROUTE SAVED');
}

function renderFavourites(){
  const list=document.getElementById('favList');
  if(!favouriteRoutes.length){
    list.innerHTML='<div class="explore-empty">No saved routes yet.</div>';
    return;
  }
  list.innerHTML='';
  favouriteRoutes.forEach((f,i)=>{
    const item=document.createElement('div');
    item.className='fav-item';
    item.innerHTML='⭐ '+escapeHtml(f.name)+
      ' <button onclick="driveFavourite('+i+')">Drive</button>'+
      ' <button onclick="deleteFavourite('+i+')">✕</button>';
    list.appendChild(item);
  });
}

function driveFavourite(i){
  const f=favouriteRoutes[i];
  if(!f)return;
  document.getElementById('dest').value=f.name;
  driveToPoint([f.lon,f.lat],f.name);
}

function deleteFavourite(i){
  favouriteRoutes.splice(i,1);
  localStorage.setItem('roadmate_favourites',JSON.stringify(favouriteRoutes));
  renderFavourites();
}

function toggleFavourites(){
  const p=document.getElementById('favouritesPanel');
  p.style.display=p.style.display==='block'?'none':'block';
  if(p.style.display==='block')renderFavourites();
}
function hideFavourites(){document.getElementById('favouritesPanel').style.display='none'}

async function geocode(q){
  const r=await fetch(
    'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q='+
    encodeURIComponent(q),
    {headers:{'Accept':'application/json'}}
  );
  const d=await r.json();
  return d[0] ? [+d[0].lon,+d[0].lat,d[0].display_name] : null;
}

const IDEA_TYPES={
  viewpoint:{icon:'🌄',label:'Viewpoints',tags:'["tourism"="viewpoint"]'},
  waterfall:{icon:'💦',label:'Waterfalls',tags:'["waterway"="waterfall"]'},
  castle:{icon:'🏰',label:'Castles',tags:'["historic"="castle"]'},
  park:{icon:'🌲',label:'Parks',tags:'["leisure"="park"]'},
  cafe:{icon:'☕',label:'Cafés',tags:'["amenity"="cafe"]'},
  attraction:{icon:'🎡',label:'Attractions',tags:'["tourism"="attraction"]'},
  pub:{icon:'🍺',label:'Pubs',tags:'["amenity"="pub"]'}
};


function getCurrentPositionPromise(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){reject(new Error('GPS unavailable'));return}
    navigator.geolocation.getCurrentPosition(resolve,reject,{
      enableHighAccuracy:true,maximumAge:30000,timeout:12000
    });
  });
}

async function nearbyIdeas(){
  try{
    status('LOCATING');
    const p=await getCurrentPositionPromise();
    me=[p.coords.longitude,p.coords.latitude];
    exploreCentre=me;
    setCar(me,p.coords.heading);
    map.setView([me[1],me[0]],13);
    status('LOCATION ON');
    // Pull a mixed set of nearby categories.
    const categories=['viewpoint','waterfall','castle','park','cafe','attraction'];
    const picked=categories[Math.floor(Math.random()*categories.length)];
    await findIdeas(picked);
  }catch(e){
    console.error(e);status('LOCATION DENIED');
  }
}

async function randomDriveNearMe(){
  try{
    status('FINDING DRIVE');
    const p=await getCurrentPositionPromise();
    me=[p.coords.longitude,p.coords.latitude];
    exploreCentre=me;
    setCar(me,p.coords.heading);
    map.setView([me[1],me[0]],13);

    // Search several categories and combine them, then randomly choose one.
    const categories=['viewpoint','waterfall','castle','park','cafe','attraction'];
    const all=[];
    for(const category of categories){
      try{
        const cfg=IDEA_TYPES[category];
        const [lon,lat]=me;
        const query='[out:json][timeout:12];node(around:40000,'+lat+','+lon+')'+
          cfg.tags+';out center 20;';
        const r=await fetch('https://overpass-api.de/api/interpreter',{
          method:'POST',
          headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
          body:'data='+encodeURIComponent(query)
        });
        const data=await r.json();
        (data.elements||[]).filter(x=>x.tags&&x.tags.name).forEach(x=>{
          const point=x.lat!=null?[x.lon,x.lat]:[x.center.lon,x.center.lat];
          const dist=haversine(lat,lon,point[1],point[0]);
          // Prefer destinations 5–40 km away: actual "drive" rather than something next door.
          if(dist>=3 && dist<=40){
            all.push({
              name:x.tags.name,point,distance:dist,
              icon:cfg.icon,category:cfg.label
            });
          }
        });
      }catch(err){ console.warn(category,err); }
    }

    // Remove duplicate names/locations.
    const unique=[];
    const seen=new Set();
    all.sort((a,b)=>a.distance-b.distance);
    all.forEach(p=>{
      const key=p.name.toLowerCase()+'|'+p.point.map(v=>v.toFixed(3)).join(',');
      if(!seen.has(key)){seen.add(key);unique.push(p);}
    });

    if(!unique.length){
      status('NO IDEAS');
      document.getElementById('ideaList').innerHTML=
        '<div class="explore-empty">No random drive ideas found nearby. Try again.</div>';
      return;
    }

    // Weight toward reasonably close drives, while keeping it random.
    const pool=unique.slice(0,80);
    const chosen=pool[Math.floor(Math.random()*pool.length)];
    explorePlaces=pool.slice(0,8).sort(()=>Math.random()-.5);
    renderIdeas();
    driveToPoint(chosen.point,chosen.name);
  }catch(e){
    console.error(e);
    status('LOCATION DENIED');
  }
}


async function randomScenicPub(){
  try{
    status('FINDING PUB');
    const p=await getCurrentPositionPromise();
    me=[p.coords.longitude,p.coords.latitude];
    exploreCentre=me;
    setCar(me,p.coords.heading);
    map.setView([me[1],me[0]],13);

    const [lon,lat]=me;
    // Find pubs in a wide radius. The app scores them for a proper drive:
    // farther away gets some weight, and pubs with scenic/natural/waterside
    // names or nearby viewpoints/water are given extra weight.
    const query='[out:json][timeout:18];node(around:40000,'+lat+','+lon+')["amenity"="pub"];out center 120;';
    const r=await fetch('https://overpass-api.de/api/interpreter',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body:'data='+encodeURIComponent(query)
    });
    const data=await r.json();

    let pubs=(data.elements||[]).filter(x=>x.tags&&x.tags.name).map(x=>{
      const point=x.lat!=null?[x.lon,x.lat]:[x.center.lon,x.center.lat];
      const dist=haversine(lat,lon,point[1],point[0]);
      const name=x.tags.name||'Pub';
      const n=name.toLowerCase();
      let score=Math.random()*25;

      // Prefer a genuine drive (roughly 5–35 km).
      if(dist>=5&&dist<=35) score+=35;
      else if(dist>=3&&dist<=40) score+=15;
      else score-=25;

      // Soft hints for scenic-style pub names.
      if(/view|vista|hill|moor|dale|valley|lake|lakes|river|riverside|water|bay|coast|sea|beach|wood|forest|park|garden|country|inn|arms/.test(n))
        score+=35;

      return {
        name,point,distance:dist,icon:'🍺',
        category:'Scenic pub',score
      };
    }).filter(x=>x.distance>=3&&x.distance<=40)
      .sort((a,b)=>b.score-a.score);

    if(!pubs.length){
      status('NO PUBS');
      document.getElementById('ideaList').innerHTML=
        '<div class="explore-empty">No pubs found within a 40 km drive. Try again.</div>';
      return;
    }

    // Present several candidates, then randomly select one.
    explorePlaces=pubs.slice(0,12).sort(()=>Math.random()-.5).slice(0,8);
    renderIdeas();

    const chosen=explorePlaces[Math.floor(Math.random()*explorePlaces.length)];
    driveToPoint(chosen.point,chosen.name);
  }catch(e){
    console.error(e);status('LOCATION DENIED');
  }
}

async function findIdeas(category='attraction'){
  if(!exploreCentre){
    if(me) exploreCentre=me;
    else {status('CHOOSE AREA');return}
  }
  lastIdeaCategory=category;
  const cfg=IDEA_TYPES[category]||IDEA_TYPES.attraction;
  const list=document.getElementById('ideaList');
  list.innerHTML='<div class="explore-empty">🔎 Finding '+cfg.label.toLowerCase()+' nearby…</div>';

  const [lon,lat]=exploreCentre;
  const radius=35000;
  const query='[out:json][timeout:18];node(around:'+radius+','+lat+','+lon+')'+cfg.tags+
              ';out center 30;';
  try{
    const r=await fetch('https://overpass-api.de/api/interpreter',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body:'data='+encodeURIComponent(query)
    });
    const data=await r.json();
    let places=(data.elements||[]).filter(x=>x.tags&&x.tags.name).map(x=>{
      const p=x.lat!=null?[x.lon,x.lat]:[x.center.lon,x.center.lat];
      return {
        name:x.tags.name,
        point:p,
        distance:haversine(lat,lon,p[1],p[0]),
        icon:cfg.icon,
        category:cfg.label
      };
    }).sort((a,b)=>a.distance-b.distance);

    // Shuffle the first 20 so each tap can surface different ideas.
    places=places.slice(0,20).sort(()=>Math.random()-.5).slice(0,8);
    explorePlaces=places;
    renderIdeas();
    if(!places.length) list.innerHTML='<div class="explore-empty">No '+cfg.label.toLowerCase()+' found within 35 km. Try another category.</div>';
  }catch(e){
    console.error(e);
    list.innerHTML='<div class="explore-empty">Could not load ideas right now. Try again.</div>';
  }
}

function renderIdeas(){
  const list=document.getElementById('ideaList');
  list.innerHTML='';
  explorePlaces.forEach((p,i)=>{
    const card=document.createElement('div');
    card.className='idea-card';
    card.innerHTML='<div class="idea-icon">'+p.icon+'</div>'+
      '<div class="idea-name" title="'+escapeHtml(p.name)+'">'+escapeHtml(p.name)+'</div>'+
      '<div class="idea-meta">'+formatDistance(p.distance)+' • '+p.category+'</div>'+
      '<button class="idea-go" onclick="driveToIdea('+i+')">Drive there</button>';
    list.appendChild(card);
  });
}

function randomDrive(){
  if(!explorePlaces.length){
    findIdeas(lastIdeaCategory);
    return;
  }
  const p=explorePlaces[Math.floor(Math.random()*explorePlaces.length)];
  driveToPoint(p.point,p.name);
}

function driveToIdea(i){
  const p=explorePlaces[i];
  if(p)driveToPoint(p.point,p.name);
}

function driveToPoint(point,name){
  document.getElementById('dest').value=name;
  destinationPoint=[point[0],point[1]];
  if(!me){locate();status('LOCATE FIRST');return}
  status('ROUTING');
  routeToPoint(point,name);
}

async function routeToPoint(point,name){
  try{
    const url='https://router.project-osrm.org/route/v1/driving/'+
      me[0]+','+me[1]+';'+point[0]+','+point[1]+
      '?alternatives=true&geometries=geojson&overview=full&steps=true';
    const x=await (await fetch(url)).json();
    if(x.code!=='Ok')throw new Error(x.message||'Route error');
    const chosen=x.routes[0];
    destinationPoint=point;
    drawRoute(chosen.geometry);
    currentRoute=chosen;
    routeSteps=(chosen.legs||[]).flatMap(l=>l.steps||[]);
    const mins=Math.round(chosen.duration/60),km=chosen.distance/1000;
    const time=mins<60?mins+' min':Math.floor(mins/60)+'h '+mins%60+'m';
    document.getElementById('eta').textContent=time;
    document.getElementById('distance').textContent=km.toFixed(1)+' km • drive to '+name;
    status('READY');
    document.getElementById('instruction').style.display='block';
    document.getElementById('instruction').textContent='🧭 Route to '+name+' — press Start navigation';
    map.fitBounds(chosen.geometry.coordinates.map(c=>[c[1],c[0]]),{padding:[180,300]});
  }catch(e){console.error(e);status('ROUTE ERROR')}
}

function formatDistance(km){
  return km<1?(km*1000).toFixed(0)+' m':km.toFixed(1)+' km';
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function route(){
  const q=document.getElementById('dest').value.trim();
  if(!q)return;
  if(!me){locate();status('LOCATE FIRST');return}
  status('ROUTING');
  try{
    const d=await geocode(q);
    if(!d){status('NOT FOUND');return}
    destinationPoint=[d[0],d[1]];
    exploreCentre=[d[0],d[1]];
    findIdeas('attraction');

    // Public OSRM demo routing. No API key required.
    const url='https://router.project-osrm.org/route/v1/driving/'+
      me[0]+','+me[1]+';'+d[0]+','+d[1]+
      '?alternatives=true&geometries=geojson&overview=full&steps=true';

    const x=await (await fetch(url)).json();
    if(x.code!=='Ok')throw new Error(x.message||'Route error');

    let routes=x.routes||[];
    let chosen=routes[0];
    if(currentMode==='scenic'&&routes.length>1)
      chosen=routes.reduce((a,b)=>b.distance>a.distance?b:a);
    if(currentMode==='drive'&&routes.length>1) chosen=routes[1];

    drawRoute(chosen.geometry);

    routeSteps=(chosen.legs||[]).flatMap(l=>l.steps||[]);

    const mins=Math.round(chosen.duration/60),km=chosen.distance/1000;
    const time=mins<60?mins+' min':Math.floor(mins/60)+'h '+mins%60+'m';
    document.getElementById('eta').textContent=time;
    document.getElementById('distance').textContent=
      km.toFixed(1)+' km • '+currentMode+' route';
    status('READY');
    document.getElementById('instruction').style.display='block';
    document.getElementById('instruction').textContent=
      '🧭 Route ready — press Start navigation';

    const coords=chosen.geometry.coordinates.map(c=>[c[1],c[0]]);
    map.fitBounds(coords,{padding:[180,300]});
  }catch(e){
    console.error(e); status('ROUTE ERROR');
  }
}

function drawRoute(geometry){
  if(routeLine)map.removeLayer(routeLine);
  if(routeAltLine)map.removeLayer(routeAltLine);
  const coords=geometry.coordinates.map(c=>[c[1],c[0]]);
  routeLine=L.polyline(coords,{weight:7,opacity:.95}).addTo(map);
}

function speak(text,force=false){
  if(!voiceEnabled||!('speechSynthesis'in window)||!text)return;
  const now=Date.now();
  if(!force&&(text===lastSpoken||now-lastSpokenAt<4500))return;
  lastSpoken=text;lastSpokenAt=now;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB';u.rate=.9;u.pitch=1;u.volume=1;
  const v=speechSynthesis.getVoices().find(x=>/^en-GB/i.test(x.lang));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

function toggleVoice(){
  voiceEnabled=!voiceEnabled;
  if(!voiceEnabled&&'speechSynthesis'in window)speechSynthesis.cancel();
  document.querySelectorAll('.round')[3].textContent=voiceEnabled?'🔊':'🔇';
}


function maneuverArrow(type,modifier){
  if(type==='roundabout') return '↻';
  if(type==='arrive') return '✓';
  if(type==='merge') return '↗';
  if(type==='fork') return '↗';
  const m=(modifier||'').toLowerCase();
  if(m.includes('uturn')) return '↶';
  if(m.includes('sharp left')) return '↙';
  if(m.includes('left')) return '←';
  if(m.includes('sharp right')) return '↘';
  if(m.includes('right')) return '→';
  return '↑';
}

function cleanRoadName(name){
  return name ? String(name) : '';
}

function stepDistanceText(km){
  return km<1 ? Math.round(km*1000)+' m' : km.toFixed(1)+' km';
}

function updateNavCard(step, nextStep){
  const card=document.getElementById('navCard');
  if(!navigationRunning || !step){
    card.style.display='none';
    return;
  }
  card.style.display='block';

  const m=step.maneuver||{};
  const type=m.type||'continue', mod=m.modifier||'';
  const dist=step.distance||0;
  let text='Continue';
  if(type==='turn') text='Turn '+mod.replace('-', ' ');
  else if(type==='new name') text='Continue';
  else if(type==='merge') text='Merge '+mod.replace('-', ' ');
  else if(type==='roundabout') text='Enter the roundabout';
  else if(type==='arrive') text='Arrive at your destination';

  document.getElementById('maneuverIcon').textContent=maneuverArrow(type,mod);
  document.getElementById('navDistance').textContent=stepDistanceText(dist/1000);
  document.getElementById('navInstruction').textContent=text;
  document.getElementById('navRoad').textContent=cleanRoadName(step.name);

  const sign=document.getElementById('roadSign');
  const signText=document.getElementById('roadSignText');
  const ref=(step.ref||'').trim();
  if(ref){
    sign.style.display='block';
    signText.textContent=ref;
  }else{
    sign.style.display='none';
  }

  if(nextStep){
    const nm=nextStep.maneuver||{};
    let nextText='Then continue';
    if(nm.type==='turn') nextText='Then turn '+(nm.modifier||'');
    else if(nm.type==='roundabout') nextText='Then enter the roundabout';
    document.getElementById('nextTurn').textContent=nextText;
  }else{
    document.getElementById('nextTurn').textContent='You are approaching your destination';
  }
}

function startNavigation(){
  if(!me||!destinationPoint){status('ROUTE FIRST');return}
  navigationRunning=true;lastSpoken='';lastSpokenAt=0;lastInstructionIndex=-1;
  document.getElementById('startNav').style.display='none';
  document.getElementById('stopNav').style.display='block';
  document.getElementById('instruction').style.display='block';
  status('NAVIGATING');
  document.getElementById('navCard').style.display='block';
  if(routeSteps.length) updateNavCard(routeSteps[0],routeSteps[1]||null);
  map.setView([me[1],me[0]],17);
  speak('Navigation started',true);

  if(navWatch!==null)navigator.geolocation.clearWatch(navWatch);
  navWatch=navigator.geolocation.watchPosition(pos=>{
    me=[pos.coords.longitude,pos.coords.latitude];
    setCar(me,pos.coords.heading);
    if(navigationRunning)map.setView([me[1],me[0]],17,{animate:true,duration:.5});
    updateInstruction();
  },()=>status('GPS SIGNAL LOST'),{
    enableHighAccuracy:true,maximumAge:1000,timeout:10000
  });
}

function updateInstruction(){
  if(!destinationPoint)return;
  const distance=haversine(me[1],me[0],destinationPoint[1],destinationPoint[0]);
  if(distance<.05){
    document.getElementById('instruction').textContent='🏁 You have arrived';
    document.getElementById('navInstruction').textContent='You have arrived';
    document.getElementById('navDistance').textContent='✓';
    document.getElementById('maneuverIcon').textContent='✓';
    status('ARRIVED');
    speak('You have arrived at your destination',true);
    stopNavigation();return;
  }

  let nearest=-1,best=Infinity;
  routeSteps.forEach((s,i)=>{
    if(!s.maneuver||!s.maneuver.location)return;
    const dd=haversine(me[1],me[0],s.maneuver.location[1],s.maneuver.location[0]);
    if(dd<best){best=dd;nearest=i}
  });

  // Select the next meaningful maneuver rather than constantly changing the card.
  if(nearest>=0){
    let idx=nearest;
    while(idx<routeSteps.length-1 &&
          (!routeSteps[idx].maneuver || routeSteps[idx].maneuver.type==='depart')){
      idx++;
    }
    navStepIndex=idx;
    const s=routeSteps[idx];
    const next=routeSteps[idx+1]||null;
    updateNavCard(s,next);

    if(idx!==lastInstructionIndex && best<.15){
      const m=s.maneuver||{}, type=m.type||'continue', mod=m.modifier||'';
      let spoken='Continue';
      if(type==='turn')spoken='Turn '+mod.replace('-', ' ');
      else if(type==='merge')spoken='Merge '+mod.replace('-', ' ');
      else if(type==='roundabout')spoken='Enter the roundabout';
      else if(type==='arrive')spoken='You have arrived';
      if(s.name && type!=='arrive') spoken+=' onto '+s.name;
      document.getElementById('instruction').textContent='🧭 '+spoken;
      speak(spoken);
      lastInstructionIndex=idx;
    }
  }else{
    const remaining=distance<1?(distance*1000).toFixed(0)+' m':distance.toFixed(1)+' km';
    document.getElementById('instruction').textContent='🧭 Continue on route • '+remaining+' remaining';
  }
}

function stopNavigation(){
  navigationRunning=false;
  if(navWatch!==null){navigator.geolocation.clearWatch(navWatch);navWatch=null}
  if('speechSynthesis'in window)speechSynthesis.cancel();
  document.getElementById('startNav').style.display='block';
  document.getElementById('stopNav').style.display='none';
  status('READY');
  document.getElementById('navCard').style.display='none';
}

function haversine(a,b,c,d){
  const R=6371,rad=Math.PI/180,da=(c-a)*rad,db=(d-b)*rad;
  const x=Math.sin(da/2)**2+
    Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(db/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

document.getElementById('dest').addEventListener('keydown',e=>{
  if(e.key==='Enter')route();
});

init();
updateQuickLabels();
renderFavourites();
</script>
